name: kultrip-daily-summary

on:
  schedule:
    # 06:00 Europe/Madrid during standard time (UTC+1).
    # Note: During daylight saving time this runs one hour later locally.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore send state cache
        uses: actions/cache@v4
        with:
          path: |
            gtm/logs
          key: kultrip-gtm-state
          restore-keys: |
            kultrip-gtm-state

      - name: Send summary (last 24h)
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          AGENCY_EMAIL: ${{ secrets.AGENCY_EMAIL }}
        run: python gtm/summary.py --hours 24
